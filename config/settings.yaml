app:
  agent_name: Agentic-AI-Benchmark-Agent
  report_output_dir: data/reports
  result_output_dir: data/results
  default_command_timeout_seconds: 30
  inspect_dmesg: false
  selected_env_vars:
    - CUDA_HOME
    - NCCL_DEBUG
    - NVIDIA_VISIBLE_DEVICES
    - CUDA_VISIBLE_DEVICES
  system_parameters:
    - vm.swappiness
    - kernel.numa_balancing
    - vm.zone_reclaim_mode
  enable_benchmarks:
    nccl: true
    nccl_alltoall: true
    nvbandwidth: true
  benchmark_profiles_file: config/benchmark_profiles.yaml
