nccl:
  default:
    name: default
    enabled: true
    binary_path: /opt/nccl-tests/build/all_reduce_perf
    env:
      NCCL_NTHREADS: "128"
      NCCL_MIN_NCHANNELS: "8"
      NCCL_P2P_LEVEL: "SYS"
    args:
      - "-b"
      - "128"
      - "-e"
      - "8G"
      - "-f"
      - "2"
      - "-g"
      - "8"
    timeout_seconds: 1800
    repetitions: 1
  quick:
    name: quick
    enabled: true
    binary_path: /opt/nccl-tests/build/all_reduce_perf
    env:
      NCCL_NTHREADS: "128"
      NCCL_MIN_NCHANNELS: "8"
      NCCL_P2P_LEVEL: "SYS"
    args:
      - "-b"
      - "128"
      - "-e"
      - "8G"
      - "-f"
      - "2"
      - "-g"
      - "8"
    timeout_seconds: 1800
    repetitions: 1
