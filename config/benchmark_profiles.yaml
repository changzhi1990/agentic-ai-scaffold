nvbandwidth:
  default:
    name: default
    enabled: true
    binary_path: /opt/nvbandwidth/nvbandwidth
    args:
      - "--testcase"
      - "device_to_device_memcpy_read_ce"
    timeout_seconds: 180
    repetitions: 1
